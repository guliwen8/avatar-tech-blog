# 群晖 NAS 上用 Container Manager 的「项目」功能，或命令行 docker compose up -d 启动
services:
  blog:
    build: .
    container_name: avatar-blog
    ports:
      - "3000:3000" # 左边是 NAS 对外端口，可改成别的，比如 "8080:3000"
    restart: unless-stopped
    environment:
      - DB_PATH=/app/data/blog.db
    # 把数据库目录挂载到 NAS，保证容器重建后数据不丢
    volumes:
      - ./data:/app/data
